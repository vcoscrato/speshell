name: AUR

on:
  push:
    branches: [main]
    paths: [packaging/PKGBUILD, .github/workflows/aur.yml]
  workflow_dispatch:

concurrency: aur

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write PKGBUILD and .SRCINFO
        run: |
          set -eu
          aur="$RUNNER_TEMP/aur"
          git clone https://aur.archlinux.org/speshell-git.git "$aur"
          pkgver="r$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
          sed "s/^pkgver=.*/pkgver=$pkgver/" packaging/PKGBUILD > "$aur/PKGBUILD"
          docker run --rm --user 65534:65534 --env HOME=/tmp \
            --env BUILDDIR=/tmp --env SRCDEST=/tmp --env PKGDEST=/tmp --env SRCPKGDEST=/tmp --env LOGDEST=/tmp \
            --volume "$aur:/pkg:ro" --workdir /pkg \
            archlinux:latest makepkg --printsrcinfo > "$aur/.SRCINFO"
          grep -qx $'\tpkgver = '"$pkgver" "$aur/.SRCINFO"
          echo "PKGVER=$pkgver" >> "$GITHUB_ENV"

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="Victor Coscrato" -c user.email="vcoscrato@users.noreply.github.com" \
            commit -m "Update to $PKGVER"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes" \
            git push ssh://aur@aur.archlinux.org/speshell-git.git HEAD:master
