# Speshell configuration
# Location: ~/.config/speshell/config.ini
# Saved changes apply right away. Edit it from the Power panel's header.

[Appearance]
# Colors, wallpapers, and effects come from the theme: pick one with !theme in
# the launcher, and a wallpaper with !wall. Add your own as folders in
# ~/.config/speshell/themes.

# Draw the theme's wallpaper as the desktop background (true or false). Leave it
# false to keep another wallpaper tool in charge.
drawWallpaper = false

# Speed of the theme's effects, by kind (0-3): 1 is normal, 0.5 half speed, 2 twice
# as fast, and 0 turns them off. The launcher's opening and closing, the change
# from one wallpaper to the next, and the effects on sliders, switches, and the
# things you pick.
launcherTransitionSpeed = 1.0
wallpaperTransitionSpeed = 1.0
controlEffectsSpeed = 1.0

# Pick at random each time Speshell starts: off, wallpaper (another wallpaper of
# the theme), theme (another theme, with the wallpaper last set for it), or both.
shuffleAtLaunch = off

# Speshell's text scale (0.8-1.5). This does not change monitor or application scaling.
textScale = 1.0

[Bar]
# The screen edge the bar runs along: top or bottom
position = top
# Bar height in px (24-64)
height = 40
# Bar width in percent of the screen (20-100), centered; it grows to fit its contents
width = 100
# Space between the screen's edge and the bar in px (0-64); 0 docks it to the edge
margin = 0
# Space between the bar and the windows in px (0-64)
gap = 0
# Frame the bar on the sides away from the screen's edges (edges), or on every
# side, along the screen's edges too (full)
outline = edges

[Audio]
# Volume change per wheel step over the bar's speaker and microphone (1-100)
scrollStep = 5

# The devices the speaker and microphone panels list, and a right click on their
# bar buttons cycles through: optional case-insensitive substring filters, numbered
# in display order. Empty sections list every device.
[Audio.QuickSwitch]
# 1 = Built-in Audio
# 2 = Display, HDMI

[Audio.InputQuickSwitch]
# 1 = Microphone

# Optional display-name overrides. Keys may be PipeWire names or descriptions.
[Audio.DeviceNames]
# alsa_output.pci-0000_00_1f.3.analog-stereo = Speakers

[Audio.InputDeviceNames]
# alsa_input.pci-0000_00_1f.3.analog-stereo = Microphone

[Launcher]
# Width in px (280-1200) and result rows shown before scrolling (1-20)
width = 540
visibleRows = 5
# Where ? queries and unknown bangs go: HTTPS, with one {query}
searchUrl = https://duckduckgo.com/?q={query}

# Your own bangs, as !name query: HTTPS URLs, each with one {query}
[Launcher.Bangs]
gh = https://github.com/search?q={query}
yt = https://www.youtube.com/results?search_query={query}

[Weather]
# The weather beside the bar's clock, which opens its forecast, from Open-Meteo.
# Location is a city name; leave it empty to use where your IP address places
# you. Units follow your locale's measurement system.
enabled = false
location =

[Notifications]
# Maximum toast notifications on screen at once (1-50, or -1 for all)
maxVisible = 3

[Power]
# How much power the system and Speshell use. With power-profiles-daemon, the
# system's power profile follows: performance (balanced where there is none),
# balanced, or power-saver.
# - maximum: the theme's effects animate at the display's refresh rate, and a
#   recording started outside Speshell shows within 2 s.
# - balanced: the effects animate at 60 fps (30 on battery), and those recordings
#   show within 10 s (a minute on battery).
# - saver: no theme effects (the launcher shows at once and wallpapers swap at
#   once), no motion in the interface, and those recordings show within a minute.
# Recordings and dictation started from Speshell's tools show at once in every mode.
mode = balanced

# Use saver while on battery, and mode again once plugged in. A mode picked in the
# Battery panel while on battery lasts until plugged in.
saverOnBattery = true

lockCommand = hyprlock

# Optional arguments passed directly to the locker executable, in numbered order
[Power.Arguments]
# 1 = --daemonize

[Battery]
# Notify when the battery runs down to these percentages (5-50 and 2-30). The
# critical one shows through Do Not Disturb. UPower's own critical action
# (hibernate or power off, at 2% by default) still runs after.
lowLevel = 20
criticalLevel = 10

# Stop charging at this percentage (50-100), and start again 5 points below, to
# keep the battery healthy when the laptop stays plugged in. 100 leaves charging
# as the firmware has it. Needs a battery with charge_control_end_threshold.
chargeLimit = 100

[Idle]
# Minutes without input before each step, on battery only; 0 turns it off. Apps
# can hold off idling, as video players do, and Keep awake in the bar holds it
# all off.
# Dim the screen and the keyboard backlight
dimAfter = 2
# Lock the session with [Power] lockCommand
lockAfter = 5
# Turn the displays off (Hyprland)
screenOffAfter = 6
# Sleep, after locking. Playing media holds it off.
sleepAfter = 15

[Backlight]
# Leave empty to auto-detect the backlight device under /sys/class/backlight
device =

# On unplugging, lower the screen to at most this percentage, and bring it back
# once plugged in, unless you turned it up since. 0 leaves it alone.
batteryPercent = 0

[NightLight]
# Warmer colors on every display, through hyprsunset (Hyprland). The Displays
# panel's header and `speshell nightlight on|off|toggle` turn it on and off.
enabled = false
# In kelvin (1000-6500): lower is warmer; 6500 is no change.
temperature = 4000

[Tools]
# The bar's Tools panel shows each tool once the programs it needs are installed;
# see the README. Keybindings can run them too, as speshell tool dictate, ocr,
# screenshot, record, qr, or color.

# Languages the text in screen areas is in, as Tesseract codes (eng, por, deu…),
# each with its tesseract-data package installed
ocrLanguages = eng
# Languages you dictate in, as Whisper codes (en, pt, de…). Empty detects any;
# with several, a clip detected as another language is redone in the closest one.
dictationLanguages =
# Uncommon words Whisper should spell this way, comma-separated
dictationVocabulary =
# Whisper model file. Empty uses ggml-large-v3-turbo-q5_0.bin in
# ~/.local/share/speshell/whisper; a missing ggml-*.bin is downloaded on first use.
dictationModel =
